name: Create and publish a Docker image

on:
  push:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # 为了方便在多个步骤中使用，建议将 IMAGE_NAME 定义为不包含所有者的部分
  IMAGE_NAME: gemini-telegram-webhook

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # `packages: write` 权限同时允许推送和删除镜像
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: set lower case owner name
        run: |
          echo "OWNER_LC=${REPOSITORY_OWNER,,}" >>${GITHUB_ENV}
        env:
          REPOSITORY_OWNER: '${{ github.repository_owner }}'

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # 使用 github.repository_owner 动态构建完整的镜像路径
          tags: ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/${{ env.IMAGE_NAME }}:latest

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/${{ env.IMAGE_NAME}}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      # --- 新增的清理步骤 ---
      - name: Clean up old untagged images
        uses: snok/container-retention-policy@v2
        with:
          # 要清理的镜像包名称
          image-names: ${{ env.IMAGE_NAME }}
          # 删除所有未标记的镜像
          keep-untagged: false
          # 指定所有者（你的用户名或组织名）
          owner: ${{ env.OWNER_LC }}
          # 使用 GITHUB_TOKEN 进行认证
          token: ${{ secrets.GITHUB_TOKEN }}
